name: Deploy Web to EC2

on:
  push:
    branches: [ main, master ]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Web Application to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        if: "${{ secrets.EC2_SSH_KEY != '' }}"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST || '65.2.215.48' }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            echo "Starting deployment on EC2..."
            cd /var/www/laxmisamadhan
            if [ -d .git ]; then
              git pull origin main || git pull origin master
            fi
            pm2 restart ticket-backend || true
            sudo systemctl reload nginx
            echo "Deployment successfully completed!"

      - name: Notice if Secrets Missing
        if: "${{ secrets.EC2_SSH_KEY == '' }}"
        run: |
          echo "Notice: EC2_SSH_KEY secret is not set yet in GitHub repository."
          echo "To enable automatic EC2 deployments, add EC2_HOST (65.2.215.48) and EC2_SSH_KEY to Settings -> Secrets -> Actions."
