name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build iOS App & IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: pnpm install --no-frozen-lockfile

      - name: Build Web Frontend
        working-directory: frontend
        run: pnpm run build

      - name: Sync Capacitor iOS
        working-directory: frontend
        run: npx cap sync ios

      - name: Install CocoaPods Dependencies (if Podfile exists)
        working-directory: frontend/ios/App
        run: |
          set -e
          if [ -f Podfile ]; then
            if ! command -v pod >/dev/null 2>&1; then
              gem install cocoapods --no-document || brew install cocoapods
            fi
            pod install --repo-update
          else
            echo "No Podfile found; skipping pod install"
          fi

      - name: Build & Package iOS App into IPA
        working-directory: frontend/ios/App
        run: |
          set -euo pipefail
          echo "Working dir: $(pwd)"
          ls -la

          # Choose workspace or project (.xcworkspace and .xcodeproj are bundle directories)
          if [ -d App.xcworkspace ] || [ -e App.xcworkspace ]; then
            WORKSPACE="App.xcworkspace"
            SCHEME="App"
            BUILD_CMD=(xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME")
          elif [ -d App.xcodeproj ] || [ -e App.xcodeproj ]; then
            PROJECT="App.xcodeproj"
            SCHEME="App"
            BUILD_CMD=(xcodebuild -project "$PROJECT" -scheme "$SCHEME")
          elif compgen -G "*.xcworkspace" > /dev/null; then
            WORKSPACE=$(ls -d *.xcworkspace | head -n1)
            SCHEME=$(basename "$WORKSPACE" .xcworkspace)
            BUILD_CMD=(xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME")
          elif compgen -G "*.xcodeproj" > /dev/null; then
            PROJECT=$(ls -d *.xcodeproj | head -n1)
            SCHEME=$(basename "$PROJECT" .xcodeproj)
            BUILD_CMD=(xcodebuild -project "$PROJECT" -scheme "$SCHEME")
          else
            echo "No .xcworkspace or .xcodeproj found in $(pwd)" >&2
            ls -la
            exit 1
          fi

          echo "Using build target: ${BUILD_CMD[*]}"
          "${BUILD_CMD[@]}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          # Package into .ipa using whatever .app was produced
          APP_PATH=$(find App.xcarchive/Products/Applications -name "*.app" -maxdepth 2 | head -n1 || true)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found under App.xcarchive/Products/Applications" >&2
            ls -R App.xcarchive || true
            exit 1
          fi

          echo "Found app: $APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r LaxmiSamadhan.ipa Payload/

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaxmiSamadhan-iOS-IPA
          path: frontend/ios/App/LaxmiSamadhan.ipa
          if-no-files-found: error
          retention-days: 30
