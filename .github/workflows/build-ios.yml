name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-ios.yml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build iOS App & IPA
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*.app || true
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_16.2.app"
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_16.1.app"
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_16.0.app"
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_16.app"
          fi
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          pnpm config set node-linker hoisted
          pnpm install --no-frozen-lockfile --ignore-workspace --shamefully-hoist

      - name: Build Web Frontend
        working-directory: frontend
        env:
          VITE_API_URL: https://laxmisamadhan.lifc.in/api/v1
          VITE_WS_URL: https://laxmisamadhan.lifc.in
        run: pnpm run build

      - name: Sync Capacitor iOS
        working-directory: frontend
        run: npx cap sync ios

      - name: Resolve Xcode Package Dependencies
        working-directory: frontend/ios/App
        run: |
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App || true

      - name: Build & Package iOS App into IPA
        working-directory: frontend/ios/App
        run: |
          set -euo pipefail
          echo "Working dir: $(pwd)"
          ls -la

          # Choose workspace or project (.xcworkspace and .xcodeproj are bundle directories)
          if [ -d App.xcworkspace ] || [ -e App.xcworkspace ]; then
            WORKSPACE="App.xcworkspace"
            SCHEME="App"
            BUILD_CMD=(xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME")
          elif [ -d App.xcodeproj ] || [ -e App.xcodeproj ]; then
            PROJECT="App.xcodeproj"
            SCHEME="App"
            BUILD_CMD=(xcodebuild -project "$PROJECT" -scheme "$SCHEME")
          elif compgen -G "*.xcworkspace" > /dev/null; then
            WORKSPACE=$(ls -d *.xcworkspace | head -n1)
            SCHEME=$(basename "$WORKSPACE" .xcworkspace)
            BUILD_CMD=(xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME")
          elif compgen -G "*.xcodeproj" > /dev/null; then
            PROJECT=$(ls -d *.xcodeproj | head -n1)
            SCHEME=$(basename "$PROJECT" .xcodeproj)
            BUILD_CMD=(xcodebuild -project "$PROJECT" -scheme "$SCHEME")
          else
            echo "No .xcworkspace or .xcodeproj found in $(pwd)" >&2
            ls -la
            exit 1
          fi

          echo "Listing available Xcode projects and schemes:"
          xcodebuild -list -project App.xcodeproj || true

          echo "Using build target: ${BUILD_CMD[*]}"
          "${BUILD_CMD[@]}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            CLANG_ENABLE_EXPLICIT_MODULES=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

          # Locate compiled .app inside build directory
          APP_PATH=$(find build/Build/Products -name "*.app" | head -n1 || true)
          if [ -z "$APP_PATH" ]; then
            echo "Searching for any .app in build directory..." >&2
            find build -name "*.app" || true
            exit 1
          fi

          echo "Found compiled app at: $APP_PATH"
          rm -rf Payload LaxmiSamadhan.ipa
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r LaxmiSamadhan.ipa Payload/

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaxmiSamadhan-iOS-IPA
          path: frontend/ios/App/LaxmiSamadhan.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish iOS IPA to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: latest-mobile-build
          name: "Laxmi Samadhan Latest Mobile Build (APK, AAB & IPA)"
          draft: false
          prerelease: false
          files: |
            frontend/ios/App/LaxmiSamadhan.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
