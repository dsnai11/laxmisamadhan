name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build iOS App & IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: pnpm install --no-frozen-lockfile

      - name: Build Web Frontend
        working-directory: frontend
        run: pnpm run build

      - name: Sync Capacitor iOS
        working-directory: frontend
        run: npx cap sync ios

      - name: Build iOS App using Xcode
        working-directory: frontend/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -archivePath App.xcarchive \
                     archive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY=""

      - name: Package App into IPA (Payload Archive)
        working-directory: frontend/ios/App
        run: |
          mkdir -p Payload
          cp -r App.xcarchive/Products/Applications/App.app Payload/
          zip -r LaxmiSamadhan.ipa Payload/

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaxmiSamadhan-iOS-IPA
          path: frontend/ios/App/LaxmiSamadhan.ipa
          if-no-files-found: error
          retention-days: 30
