name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-ios.yml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build iOS App & IPA
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Xcode Version & Platforms
        run: |
          echo "Available Xcode installations:"
          ls -la /Applications/ | grep -i xcode || true
          if [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s "/Applications/Xcode.app"
          fi
          echo "Active Developer Directory:"
          xcode-select -p
          xcodebuild -version
          echo "Installed SDKs:"
          xcodebuild -showsdks

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          pnpm config set node-linker hoisted
          pnpm install --no-frozen-lockfile --ignore-workspace --shamefully-hoist

      - name: Build Web Frontend
        working-directory: frontend
        env:
          VITE_API_URL: https://laxmisamadhan.lifc.in/api/v1
          VITE_WS_URL: https://laxmisamadhan.lifc.in
        run: pnpm run build

      - name: Sync Capacitor iOS
        working-directory: frontend
        run: npx cap sync ios

      - name: Resolve Xcode Package Dependencies
        working-directory: frontend/ios/App
        run: |
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App || true

      - name: Build & Package iOS App into IPA
        working-directory: frontend/ios/App
        run: |
          set -euo pipefail
          echo "Working dir: $(pwd)"
          ls -la

          echo "Listing available Xcode projects, targets, and schemes:"
          xcodebuild -list -project App.xcodeproj || true

          echo "Listing available destinations for App scheme:"
          xcodebuild -showdestinations -project App.xcodeproj -scheme App || true

          # Build release binary for iOS device
          echo "Building iOS App release binary..."
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            CLANG_ENABLE_EXPLICIT_MODULES=NO \
            COMPILER_INDEX_STORE_ENABLE=NO || \
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            CLANG_ENABLE_EXPLICIT_MODULES=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

          # Locate compiled .app inside build directory
          APP_PATH=$(find build/Build/Products -name "*.app" | head -n1 || true)
          if [ -z "$APP_PATH" ]; then
            echo "Searching for any .app in build directory..." >&2
            find build -name "*.app" || true
            exit 1
          fi

          echo "Found compiled app at: $APP_PATH"
          rm -rf Payload LaxmiSamadhan.ipa
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r LaxmiSamadhan.ipa Payload/

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaxmiSamadhan-iOS-IPA
          path: frontend/ios/App/LaxmiSamadhan.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish iOS IPA to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: latest-mobile-build
          name: "Laxmi Samadhan Latest Mobile Build (APK, AAB & IPA)"
          draft: false
          prerelease: false
          files: |
            frontend/ios/App/LaxmiSamadhan.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
