name: Tests

# Runs the backend and frontend unit tests on every push / PR to main.
# These tests lock in fixes that regressed before (ticket assigner display,
# escalation repeats, employee-code login / password reset). A red check here
# means a change has broken one of them — do not deploy until it is green.
# scripts/deploy.sh runs the same tests locally and refuses to deploy on failure.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20          # matches the EC2 server
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Unit tests
        working-directory: backend
        run: npx vitest run

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install
        working-directory: frontend
        run: |
          pnpm config set node-linker hoisted
          pnpm install --frozen-lockfile --ignore-workspace --shamefully-hoist

      - name: Unit tests
        working-directory: frontend
        run: pnpm exec vitest run
