name: Build Android APK & App Bundle (Google Play Store)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-android.yml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          pnpm config set node-linker hoisted
          pnpm install --no-frozen-lockfile --ignore-workspace --shamefully-hoist

      - name: Build Web Frontend
        working-directory: frontend
        env:
          VITE_API_URL: https://laxmisamadhan.lifc.in/api/v1
          VITE_WS_URL: https://laxmisamadhan.lifc.in
        run: pnpm run build

      - name: Sync Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Setup Release Keystore
        working-directory: frontend/android
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > laxmisamadhan-release.jks
          else
            echo "Using standard release keystore..."
            keytool -genkeypair -v -keystore laxmisamadhan-release.jks -alias laxmisamadhan -keyalg RSA -keysize 2048 -validity 10000 -storepass 'LaxmiSamadhan@2026' -keypass 'LaxmiSamadhan@2026' -dname 'CN=Laxmi India Finance, OU=IT Department, O=Laxmi India Finleasecorp Ltd, L=Jaipur, ST=Rajasthan, C=IN'
          fi

      - name: Grant Execute Permission for Gradlew
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build Android App Bundle (Google Play Store AAB)
        working-directory: frontend/android
        run: ./gradlew bundleRelease --stacktrace

      - name: Build Android Release APK (Direct Install)
        working-directory: frontend/android
        run: ./gradlew assembleRelease --stacktrace

      - name: Build Android Debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Artifacts
        run: |
          mkdir -p build-artifacts
          cp frontend/android/app/build/outputs/bundle/release/app-release.aab build-artifacts/LaxmiSamadhan-PlayStore-v1.2.aab
          cp frontend/android/app/build/outputs/apk/release/app-release.apk build-artifacts/LaxmiSamadhan-Release-v1.2.apk
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/LaxmiSamadhan-Debug.apk

      - name: Upload Google Play Store Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: LaxmiSamadhan-PlayStore-AAB
          path: build-artifacts/LaxmiSamadhan-PlayStore-v1.2.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload Signed Release APK (Direct Install)
        uses: actions/upload-artifact@v4
        with:
          name: LaxmiSamadhan-Release-APK
          path: build-artifacts/LaxmiSamadhan-Release-v1.2.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LaxmiSamadhan-Debug-APK
          path: build-artifacts/LaxmiSamadhan-Debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Android APK & AAB to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: latest-mobile-build
          name: "Laxmi Samadhan Latest Mobile Build (APK & AAB)"
          draft: false
          prerelease: false
          files: |
            build-artifacts/LaxmiSamadhan-PlayStore-v1.2.aab
            build-artifacts/LaxmiSamadhan-Release-v1.2.apk
            build-artifacts/LaxmiSamadhan-Debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
